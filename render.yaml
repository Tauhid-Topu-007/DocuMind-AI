# Optional Render Blueprint. You can also create the service manually (see DEPLOYMENT.md).
services:
  - type: web
    name: documind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: FASTEMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: VECTOR_DB
        value: qdrant
      - key: DATABASE_NAME
        value: documind
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
